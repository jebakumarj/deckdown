<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid slice" role="img" aria-label="">
  <defs>
    <radialGradient id="emberDark" cx="24%" cy="12%" r="60%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.22" />
      <stop offset="45%" stop-color="#b46a1c" stop-opacity="0.10" />
      <stop offset="100%" stop-color="#121315" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="plum" cx="84%" cy="6%" r="58%">
      <stop offset="0%" stop-color="#6d4a7a" stop-opacity="0.30" />
      <stop offset="100%" stop-color="#121315" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="teal" cx="10%" cy="94%" r="60%">
      <stop offset="0%" stop-color="#1d5d5a" stop-opacity="0.32" />
      <stop offset="100%" stop-color="#121315" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="rust" cx="92%" cy="90%" r="52%">
      <stop offset="0%" stop-color="#8a3f16" stop-opacity="0.26" />
      <stop offset="100%" stop-color="#121315" stop-opacity="0" />
    </radialGradient>

    <linearGradient id="settleDark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#121315" stop-opacity="0" />
      <stop offset="70%" stop-color="#121315" stop-opacity="0.55" />
      <stop offset="100%" stop-color="#121315" stop-opacity="0.94" />
    </linearGradient>

    <!-- Faint slide outlines: the product, drawn as wallpaper. -->
    <g id="slideDark">
      <rect x="0" y="0" width="320" height="180" rx="10" fill="none" stroke="#ffffff" stroke-opacity="0.07" stroke-width="1.5" />
      <path d="M28 52h150M28 88h250M28 124h96" stroke="#ffffff" stroke-opacity="0.05" stroke-width="1.5" stroke-linecap="round" />
    </g>

    <filter id="grain-dark" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" stitchTiles="stitch" />
      <feColorMatrix type="saturate" values="0" />
    </filter>
  </defs>

  <rect width="1600" height="1000" fill="#121315" />
  <rect width="1600" height="1000" fill="url(#emberDark)" />
  <rect width="1600" height="1000" fill="url(#plum)" />
  <rect width="1600" height="1000" fill="url(#teal)" />
  <rect width="1600" height="1000" fill="url(#rust)" />

  <g>
    <use href="#slideDark" transform="translate(96 132) rotate(-9)" />
    <use href="#slideDark" transform="translate(1210 112) rotate(7)" />
    <use href="#slideDark" transform="translate(1290 648) rotate(-6)" />
    <use href="#slideDark" transform="translate(58 700) rotate(5)" />
  </g>

  <rect width="1600" height="1000" fill="url(#settleDark)" />
  <rect width="1600" height="1000" filter="url(#grain-dark)" opacity="0.07" />
</svg>
